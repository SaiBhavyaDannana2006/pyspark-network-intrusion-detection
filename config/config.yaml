# ==============================================================================
# SentinelSpark — Network Intrusion Intelligence Configuration
# ==============================================================================

spark:
  app_name: "SentinelSpark-Network-Intrusion-Intelligence"
  master: "local[*]"
  driver_memory: "4g"
  executor_memory: "4g"
  driver_max_result_size: "2g"
  sql_shuffle_partitions: 8
  serializer: "org.apache.spark.serializer.KryoSerializer"
  log_level: "WARN"
  kryoserializer_buffer_max: "512m"
  ui_enabled: false

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  results_dir: "results"
  figures_dir: "results/figures"

  # Dataset Discovery Order:
  # 1. raw_train_file and raw_test_file in raw_dir
  # 2. combined_file in raw_dir or project root
  # 3. fallback to synthetic UNSW-NB15 generator if files are absent
  discovery_files:
    train_filename: "UNSW_NB15_training-set.csv"
    test_filename: "UNSW_NB15_testing-set.csv"
    combined_filename: "UNSW-NB15_combined.csv"
  
  allow_synthetic_fallback: true
  synthetic_sample_size: 15000
  synthetic_fallback:
    enabled: true
    num_samples: 15000

splits:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  seed: 42

features:
  id_column: "id"
  target_binary: "label"
  target_multiclass: "attack_cat"

  categorical_cols:
    - "proto"
    - "service"
    - "state"

  binary_indicator_cols:
    - "is_ftp_login"
    - "is_sm_ips_ports"

  continuous_numeric_cols:
    - "dur"
    - "spkts"
    - "dpkts"
    - "sbytes"
    - "dbytes"
    - "rate"
    - "sttl"
    - "dttl"
    - "sload"
    - "dload"
    - "sloss"
    - "dloss"
    - "sinpkt"
    - "dinpkt"
    - "sjit"
    - "djit"
    - "swin"
    - "stcpb"
    - "dtcpb"
    - "dwin"
    - "tcprtt"
    - "synack"
    - "ackdat"
    - "smean"
    - "dmean"
    - "trans_depth"
    - "response_body_len"
    - "ct_srv_src"
    - "ct_state_ttl"
    - "ct_dst_ltm"
    - "ct_src_dport_ltm"
    - "ct_dst_sport_ltm"
    - "ct_dst_src_ltm"
    - "ct_ftp_cmd"
    - "ct_flw_http_mthd"
    - "ct_src_ltm"
    - "ct_srv_dst"

  # Engineered interaction & behavioral features
  engineered_ratio_cols:
    - "bytes_per_packet_src"
    - "bytes_per_packet_dst"
    - "packet_ratio"
    - "byte_ratio"
    - "tcp_handshake_ratio"
    - "total_packets"
    - "total_bytes"
    - "packet_rate"
    - "byte_rate"
    - "avg_bytes_per_packet"
    - "sbyte_ratio"
    - "packet_size_ratio"
    - "load_ratio"
    - "ttl_ratio"
    - "tcprtt_ratio"

preprocessing:
  handle_missing_strategy: "median_and_mode"
  string_indexer_handle_invalid: "keep"
  outlier_clipping_quantile: 0.999
  standardize_features: true
  pca_enabled: false
  pca_k: 20

models:
  stage1_binary:
    logistic_regression:
      max_iter: 50
      reg_param: 0.01
      elastic_net_param: 0.0
      standardization: true
      threshold: 0.5
      weight_col: "class_weight"
    random_forest:
      num_trees: 100
      max_depth: 12
      max_bins: 128
      feature_subset_strategy: "auto"
      seed: 42
      weight_col: "class_weight"
    gbt:
      max_iter: 40
      max_depth: 8
      max_bins: 128
      step_size: 0.1
      seed: 42
    best_model_metric: "areaUnderROC"

  stage2_multiclass:
    random_forest:
      num_trees: 100
      max_depth: 14
      max_bins: 128
      feature_subset_strategy: "sqrt"
      seed: 42
      weight_col: "class_weight"
    best_model_metric: "f1"

tuning:
  enabled: false
  num_folds: 3
  metric_name: "weightedF1"
  param_grids:
    rf_num_trees: [50, 100]
    rf_max_depth: [8, 12]
    rf_max_bins: [64, 128]

evaluation:
  binary_threshold: 0.5
  metrics:
    - "accuracy"
    - "weightedPrecision"
    - "weightedRecall"
    - "f1"
    - "areaUnderROC"
    - "areaUnderPR"
